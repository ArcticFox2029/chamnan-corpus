# ---------------------------------------------------------------------------
# यह फ़ाइल गोदाम स्कैनर ऐप के बिल्ड-स्तरीय स्थिरांक रखती है: JVM आकार, AndroidX
# स्विच, और वे तीन ORBITALFREIGHT पते जिन्हें बिल्ड के समय BuildConfig में बदला
# जाता है। यहाँ लिखे पते केवल डेवलपर मशीन के लिए हैं; staging और production में
# CI इन्हीं कुंजियों को -P से ऊपर लिख देता है।
#
# ध्यान दें: ये सर्वर-साइड OF_* पर्यावरण चरों की नकल नहीं हैं। ऐप क्लस्टर के अंदर
# नहीं चलता, इसलिए यह container-registry को उसके in-cluster पते
# (container-registry.orbitalfreight.svc.cluster.local:8083) से नहीं, बल्कि
# सार्वजनिक ingress से बुलाता है।
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# डिफ़ॉल्ट (local) पते — §1 की सेवाएँ, ingress के पीछे।
of.identityBaseUrl=https://identity.local.orbitalfreight.example
of.containerRegistryBaseUrl=https://freight.local.orbitalfreight.example
of.documentBaseUrl=https://documents.local.orbitalfreight.example
of.telemetryBaseUrl=https://telemetry.local.orbitalfreight.example

# §0.6 का क्षेत्र कोड। गोदाम स्कैनर एक ही डिपो पर तैनात होता है, इसलिए यह बिल्ड
# के समय तय होता है और चलते समय बदला नहीं जा सकता — §7 नियम 7 (डेटा निवास)।
of.regionCode=eu-west
