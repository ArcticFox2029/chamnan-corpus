# Workspace-Wurzel des Depot-Gateway-Agenten. Hier liegt bewusst nur ein einziges Rust-Crate:
# der Wire-Codec `ofwire` ist in Zig geschrieben, weil ihn die Sensorknoten unter firmware/
# (C11) und der Agent gemeinsam benutzen, und wird über build.rs als statische Bibliothek
# eingebunden statt als Cargo-Abhängigkeit.

[workspace]
resolver = "2"
members = ["gateway-agent"]

[workspace.package]
version = "4.2.0"          # folgt der SPEC-Version, nicht der Firmware-Version
edition = "2021"
rust-version = "1.77"      # gleiche Toolchain wie services/telemetry-ingest
license = "LicenseRef-OrbitalFreight-Internal"

[workspace.dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prost = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
jsonwebtoken = "9"
ulid = "1"
rand = "0.8"
libc = "0.2"

# Der Agent läuft auf ARMv7-Boxen mit 512 MB RAM im Depot. Debug-Symbole bleiben drin
# (Crash-Dumps kommen per Support-Ticket zurück), aber die Binary wird auf Größe optimiert.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"
debug = 1
