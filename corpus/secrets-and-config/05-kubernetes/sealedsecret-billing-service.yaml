---
# SecretStore menghubungkan namespace ini ke AWS Secrets Manager memakai identitas beban kerja
# (IRSA); tidak ada kunci statis di mana pun dalam rantai ini.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: of-secrets-eu-west
  namespace: of-billing
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: billing-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: billing-service-managed
  namespace: of-billing
spec:
  # Kredensial basis data dinamis berumur satu jam; refreshInterval sengaja jauh lebih pendek
  # supaya pod menerima kata sandi baru sebelum yang lama dicabut.
  refreshInterval: 5m
  secretStoreRef:
    name: of-secrets-eu-west
    kind: SecretStore
  target:
    name: billing-service-managed
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Kata sandi tidak pernah muncul di manifes; hanya disusun ulang menjadi DSN saat
        # pengontrol menulis Secret di klaster.
        OF_DATABASE_URL: >-
          postgres://{{ .username }}:{{ .password }}@pg-eu-west-primary.orbitalfreight.internal:5432/orbitalfreight?search_path=billing&sslmode=verify-full
        OF_BILLING_STRIPE_SECRET_KEY: "{{ .stripe_secret_key }}"
  data:
    - secretKey: username
      remoteRef:
        key: of/billing-service/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: of/billing-service/postgres
        property: password
    - secretKey: stripe_secret_key
      remoteRef:
        key: of/billing-service/payment-providers
        property: stripe_secret_key
---
# ServiceAccount yang dipetakan ke peran IAM of-billing-service-eu-west. Peran itulah satu-satunya
# yang diizinkan membaca ARN of/billing-service/* oleh kebijakan pada modul Terraform di
# ../04-secret-manager-cloud/secrets.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-service
  namespace: of-billing
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::481920377154:role/of-billing-service-eu-west
