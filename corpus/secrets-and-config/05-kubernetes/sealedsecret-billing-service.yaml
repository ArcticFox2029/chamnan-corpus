# Cara yang benar untuk rahasia produksi billing-service: nilai terenkripsi di dalam Git, dan
# nilai yang ditarik langsung dari penyedia saat pod hidup.
#
# SealedSecret dienkripsi ke kunci publik pengontrol di klaster tujuan, jadi berkas ini aman
# berada di repositori: hanya pengontrol di klaster eu-west yang memegang kunci privatnya, dan
# ciphertext-nya terikat ke namespace serta nama Secret (scope strict). Menyalinnya ke namespace
# lain membuatnya gagal dibuka, bukan bocor.
#
# ExternalSecret di bawahnya dipakai untuk kredensial yang dirotasi otomatis oleh penyedia —
# kata sandi PostgreSQL dinamis dan kunci penyedia pembayaran — sehingga tidak ada yang perlu
# menyentuh Git setiap kali rotasi terjadi.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: billing-service-env
  namespace: of-billing
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
    of.orbitalfreight.io/sealed-with: of-sealed-secrets-eu-west-2026-01
spec:
  template:
    metadata:
      name: billing-service-env
      namespace: of-billing
      labels:
        app.kubernetes.io/name: billing-service
        of.orbitalfreight.io/region-code: eu-west
    type: Opaque
  encryptedData:
    # Rahasia penanda tangan webhook penyedia pembayaran.
    OF_BILLING_STRIPE_WEBHOOK_SECRET: vwS3Nmk7BHCfReW7cGVkXuwZFALuquIOkKcrz95gEsM4XOWTAlLEkJ2hR07adoBMV6YPSR2Se6dl
      E/sL3TAYZEZv7s4/7Rv8vZahF9kEUsf8DsF6cnDeGe8KMOTO4dPXXAj3aBhQvMd7I5GKh+1LL2zK
      LbKax2PrxUbuPLjo62v87fOscUjAVitwFsqFV994HoD6uCoeKEXsHyM47hzlOrRfUod1Xo3JyvCA
      7qVzkZLd3mtr42fttdKBUv7Ro4cqqn/A/WZVd7ROAcFZKAS9DXLzG9vLpW6IYtSs2FS5GGIG07Cm
      RsVGskifl4pQ0l+JqcEZkin9BHEpHfitGcIaGQ==
    # Kunci HMAC untuk menandatangani nomor faktur pada tautan pembayaran publik.
    OF_BILLING_INVOICE_LINK_HMAC_KEY: SXfTtJ729vblTtS6wpct366LJVW7PouJc3anno+fM+EpgwPskzEMxxYp+dNa0Dry8Ld5QCGAI+60
      4lExsvjqVlBiBXOedVZT79312mEpnzDx8p80ubI1RmYHwhYO//bi4nmCwvglE63DWVwX6/oEqL8C
      FrjxZbf//l6lh7jINmF882vb7LSmLD4746YMnRAaqTq0PxX35CeaVQ4HRiowE76erl1goMW53B2y
      KlkijQTNyDXRs2UBCj9QZWPHpJihZXJVlIQ5xdn1/okzAvnU1ncoR5+3P5JEHUaab4KbIjm8RA/D
      1Ldmepr0gcp61I3M2Q9Q+TkJ+2efP1GjdAxlSg==
    # Kredensial SCRAM untuk topik of.billing.v1.
    OF_KAFKA_SCRAM_PASSWORD: kz7w/FFCq4MoGqztnrNl7VRz7IAsVoJ8/0zE77GXi5Rn/p0MoztsDJK9/Mvg2uRC3JtJmtAIaHuT
      zSVWQHb2fy0hSc8/vB69Qrmpi+EJNvPZ4yC8f66xseNkuiabgQiShS6LgiaPujaUJEJfbOJRkQf8
      lk4Lq/TjOwAwUFDNXhQ0gCBS7FuhZgVsDrnnMapcR4r3jWfwoTHI/jofJdAM51203K2Uvxog/yDN
