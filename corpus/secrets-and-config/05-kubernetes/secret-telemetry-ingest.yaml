# Secret Kubernetes biasa untuk telemetry-ingest di overlay `ci`.
#
# Manifes ini hanya dipasang di klaster CI, tempat basis datanya sekali pakai dan dihapus tiap
# malam. Isi `data` di Secret bawaan Kubernetes tidak dienkripsi — hanya base64 — sehingga siapa
# pun yang boleh `kubectl get secret -o yaml` di namespace ini membaca kata sandinya utuh, dan
# nilainya juga tersimpan apa adanya di etcd kalau enkripsi at-rest belum dinyalakan.
#
# Untuk produksi, bentuk yang dipakai ada di sealedsecret-billing-service.yaml: nilai
# terenkripsi ke kunci klaster, atau ditarik dari penyedia lewat ExternalSecret. Overlay
# produksi telemetry-ingest karena itu menimpa seluruh berkas ini, bukan menambahinya.
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-ingest-env
  namespace: of-telemetry
  labels:
    app.kubernetes.io/name: telemetry-ingest
    app.kubernetes.io/part-of: orbitalfreight
    of.orbitalfreight.io/region-code: eu-west
  annotations:
    of.orbitalfreight.io/owner: platform-ops
    of.orbitalfreight.io/rotation-runbook: ops/runbooks/rotate-ci-credentials.md
type: Opaque
data:
  # postgres://of_telemetry:__PLANTED_PGURL__@pg-eu-west-primary…?search_path=telemetry
  OF_DATABASE_URL: cG9zdGdyZXM6Ly9vZl90ZWxlbWV0cnk6WHEydlQ5bUxwUjRkTnM3QkBwZy1ldS13ZXN0LXByaW1hcnkub3JiaXRhbGZyZWlnaHQuaW50ZXJuYWw6NTQzMi9vcmJpdGFsZnJlaWdodD9zZWFyY2hfcGF0aD10ZWxlbWV0cnkmc3NsbW9kZT12ZXJpZnktZnVsbA==
  OF_KAFKA_BROKERS: a2Fma2EtMC5ldS13ZXN0Lm9yYml0YWxmcmVpZ2h0LmludGVybmFsOjkwOTIsa2Fma2EtMS5ldS13ZXN0Lm9yYml0YWxmcmVpZ2h0LmludGVybmFsOjkwOTI=
  OF_KAFKA_SCRAM_PASSWORD: VDdrUTJtWnI5eFR2QjVkTHBZY0g4d0pnRTQ=
  OF_TELEMETRY_RULES_PATH: L2V0Yy9vcmJpdGFsZnJlaWdodC90ZWxlbWV0cnktcnVsZXMuZXUtd2VzdC55YW1s
stringData:
  # Ditulis sebagai teks biasa supaya diff-nya terbaca saat ambang aturan diubah; kubectl tetap
  # menyimpannya ke `data` dalam bentuk base64 begitu manifes diterapkan.
  OF_TELEMETRY_GATEWAY_HMAC_SECRET: "9xTvB5dLpYcH8wJgE4aUdTr3nQ7kR2mZ"
---
# ConfigMap pendamping. Semua yang ada di sini memang bukan rahasia: alamat, ambang, dan nama
# — dan justru itu maksudnya, supaya Secret hanya berisi hal yang benar-benar rahasia.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-ingest-config
  namespace: of-telemetry
data:
  OF_SERVICE_NAME: telemetry-ingest
  OF_ENVIRONMENT: ci
  OF_REGION_CODE: eu-west
  OF_HTTP_PORT: "8084"
  OF_GRPC_PORT: "9084"
  OF_LOG_LEVEL: debug
  OF_LOG_FORMAT: json
  OF_DATABASE_MAX_CONNS: "40"
  OF_DATABASE_STATEMENT_TIMEOUT_MS: "8000"
  OF_KAFKA_CONSUMER_GROUP: telemetry-ingest-v2
  OF_IDENTITY_GRPC_ADDR: identity-service:9081
  OF_IDENTITY_JWKS_URL: http://identity-service:8081/.well-known/jwks.json
  OF_IDENTITY_JWKS_GRACE_SECONDS: "300"
  OF_CONTAINER_REGISTRY_GRPC_ADDR: container-registry:9083
  OF_GEO_GRPC_ADDR: geo-service:9086
  OF_TELEMETRY_BATCH_MAX_READINGS: "5000"
  OF_TELEMETRY_SIGNATURE_REQUIRED: "true"
  OF_TELEMETRY_PUBLISH_SAMPLE_RATE: "20"
  OF_TELEMETRY_HEARTBEAT_TIMEOUT_MINUTES: "12"
  OF_TELEMETRY_ALLOWED_REGIONS: eu-west,eu-central
  OF_OUTBOX_RELAY_INTERVAL_MS: "250"
  OF_SHUTDOWN_GRACE_SECONDS: "25"
  OF_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
  OF_OTEL_SAMPLE_RATIO: "1.0"
---
# Potongan Deployment yang memakai keduanya. Disertakan supaya terlihat bahwa nilai rahasia
# tidak pernah ditulis ulang di spesifikasi pod: semuanya lewat envFrom.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: of-telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-ingest
    spec:
      serviceAccountName: telemetry-ingest
      terminationGracePeriodSeconds: 40
      containers:
        - name: telemetry-ingest
          image: 481920377154.dkr.ecr.eu-west-1.amazonaws.com/of/telemetry-ingest:3.11.4
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 9084
          envFrom:
            - configMapRef:
                name: telemetry-ingest-config
            - secretRef:
                name: telemetry-ingest-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
