;
; Ini salinan ~/.of/credentials milik seorang teknisi yang ikut ter-commit pada 2024-03-19
; (commit 9c2f4b7) ketika direktori kerja ditambahkan dengan `git add .`. Ia sempat dihapus,
; lalu dikembalikan setahun kemudian karena dua runbook lama masih membacanya dengan
