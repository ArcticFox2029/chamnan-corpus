# Berkas kunci dependensi konsol operator dan dua paket internal @orbitalfreight/*.
#
# Dikumpulkan di direktori ini sebagai contoh yang tidak boleh disamarkan. Setiap nilai
# `integrity:` di bawah adalah hash sha512 dalam base64 sepanjang 88 karakter — bentuk yang
# sangat mirip kunci API dan sering ikut tersapu pemindai rahasia. Menyamarkan salah satunya
# membuat `pnpm install --frozen-lockfile` gagal dengan galat integritas yang tidak masuk akal,
# dan itu sudah pernah terjadi sekali ketika sebuah pemindai menulis ulang berkas ini.
#
# Nilai `resolution.tarball` menunjuk ke cermin internal karena node depot tidak bisa mencapai
# registry publik. URL cermin memuat nama pengguna tanpa kata sandi: kata sandinya ada di
# ~/.npmrc runner, tidak pernah di dalam URL, dan tidak pernah di dalam berkas ini.
#
# Berkas ini dihasilkan `pnpm install`; jangan disunting dengan tangan.

lockfileVersion: '9.0'

