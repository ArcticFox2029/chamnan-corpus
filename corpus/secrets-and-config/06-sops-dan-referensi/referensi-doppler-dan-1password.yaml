# Referensi rahasia untuk beban kerja yang tidak berjalan di Kubernetes: perkakas pengembang di
# laptop, satu runner CI mandiri, dan dua CronJob milik tim data.
#
# Tidak ada nilai rahasia di berkas ini, dan itu inti dari kedua mekanisme di bawahnya. Yang
# tertulis hanyalah alamat — `op://` untuk 1Password, nama proyek dan config untuk Doppler —
# sehingga berkas boleh dibaca siapa pun, sementara yang bisa menukarnya menjadi nilai hanyalah
# sesi yang sudah diautentikasi.
#
# Menjalankan sesuatu dengan rahasia yang terisi:
#   op run --env-file=referensi-doppler-dan-1password.yaml -- ./ops/reconcile-yesterday.sh
#   doppler run --project orbitalfreight --config prd_eu_west -- ./ops/reconcile-yesterday.sh

apiVersion: of.orbitalfreight.io/v1
kind: SecretReferenceSet
metadata:
  name: ops-toolbox
  owner: platform-ops

# --- 1Password ---------------------------------------------------------------------------------
# Format: op://<brankas>/<item>/<ruas>. Nama brankas mengikuti region agar seorang teknisi yang
# hanya diberi akses eu-west tidak bisa membuka referensi latam-br sekalipun ia membaca berkas ini.
onepassword:
  vault_per_region:
    eu-west: OF-EU-WEST
    eu-central: OF-EU-CENTRAL
    na-east: OF-NA-EAST
    latam-br: OF-LATAM-BR
  references:
    OF_DATABASE_URL: op://OF-EU-WEST/postgres-platform/connection_string
    OF_ANALYTICS_READONLY_DATABASE_URL: op://OF-EU-WEST/postgres-analytics-ro/connection_string
    OF_KAFKA_SCRAM_PASSWORD: op://OF-EU-WEST/kafka-scram/password
    OF_LEDGER_NOTARY_TOKEN: op://OF-EU-WEST/audit-ledger-notary/token
    OF_OPS_SLACK_BOT_TOKEN: op://OF-SHARED/slack-ops-bot/credential
    OF_OPS_DATADOG_API_KEY: op://OF-SHARED/datadog/api_key
    OF_OPS_DATADOG_APP_KEY: op://OF-SHARED/datadog/app_key
  service_account:
    # Token akun layanan 1Password sendiri ada di keyring OS teknisi, tidak pernah di repositori.
    keyring_entry: orbitalfreight/op-service-account
    scopes:
      - vault:OF-EU-WEST:read_items
      - vault:OF-SHARED:read_items

# --- Doppler -----------------------------------------------------------------------------------
# Satu proyek, satu config per lingkungan dan region. Nama config sengaja sejajar dengan
# OF_ENVIRONMENT dan OF_REGION_CODE supaya salah pilih config langsung terlihat.
doppler:
  project: orbitalfreight
  configs:
    production_eu_west: prd_eu_west
    production_na_east: prd_na_east
    staging_eu_west: stg_eu_west
    ci: ci
  secret_names:
    - OF_DATABASE_URL
    - OF_KAFKA_BROKERS
    - OF_KAFKA_SCRAM_PASSWORD
    - OF_ANALYTICS_WAREHOUSE_URI
    - OF_ANALYTICS_READONLY_DATABASE_URL
    - OF_RECON_ENGINE_VERSION
  # Token layanan dibaca dari lingkungan runner (DOPPLER_TOKEN), diterbitkan berumur 24 jam dan
  # dibatasi hanya pada config di atas. Tidak ada token personal yang dipakai di otomatisasi.
  service_token_env: DOPPLER_TOKEN
  fallback_behaviour: fail-closed

# Perilaku ketika penyedia tidak bisa dihubungi: proses berhenti, bukan meneruskan dengan nilai
# kosong. Sebuah CronJob rekonsiliasi yang berjalan tanpa OF_DATABASE_URL akan membuka
# discrepancy palsu untuk seluruh hari, dan itu jauh lebih mahal daripada satu jalannya yang gagal.
on_provider_unreachable: abort
