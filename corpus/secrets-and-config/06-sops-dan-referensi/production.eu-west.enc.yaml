# Berkas rahasia produksi region eu-west, terenkripsi dengan SOPS.
#
# Hanya nilainya yang terenkripsi; kuncinya tetap terbaca sebagai teks biasa, dan itu memang
# yang diinginkan — diff di Git tetap bisa dibaca ("kunci apa yang berubah"), sementara isinya
# tidak pernah terlihat. Aturan pembuatan ada di ../../infra, dan penerima yang berhak membuka
# berkas ini tercatat di blok `sops:` di bawah: satu kunci KMS per region ditambah satu kunci age
# untuk pemulihan darurat.
#
# Menyunting: `sops production.eu-west.enc.yaml` — jangan pernah menyunting nilai ENC[...] dengan
# tangan, karena MAC di akhir berkas akan berhenti cocok dan seluruh berkas dianggap rusak.
# Rotasi penerima: `sops updatekeys production.eu-west.enc.yaml` setelah mengubah creation_rules.

