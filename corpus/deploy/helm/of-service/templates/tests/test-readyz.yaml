{{- /*
=============================================================================
Test po instalaci (`helm test`).

Neověřuje, že se pod spustil — to už udělal Helm čekáním na readiness. Ověřuje
dvě věci, které readiness neřekne:

  * /version hlásí verzi, kterou jsme nasazovali. Neshoda znamená, že běží
    starý obraz z cache uzlu — tichá varianta selhaného nasazení.
  * /readyz odpovídá i zvenčí podu, tedy že Service má endpointy a síťová
    politika propouští provoz z namespace.
=============================================================================
*/ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "of-service.fullname" . }}-test-readyz
  labels:
    {{- include "of-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: {{ .Values.image.registry }}/of/platform-tools:{{ .Chart.AppVersion }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          BASE="http://{{ include "of-service.fullname" . }}:{{ .Values.service.httpPort }}"
          curl -fsS "$BASE/readyz" > /dev/null
          VERSION=$(curl -fsS "$BASE/version")
          echo "$VERSION" | grep -q '{{ .Values.image.tag | default .Chart.AppVersion }}' || {
            echo "bezi jina verze, nez se nasazovala: $VERSION" >&2
            exit 1
          }
          echo "ok: {{ include "of-service.name" . }} odpovida a hlasi spravnou verzi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
