# =============================================================================
# nginx před PHP-FPM v obrazu partner-portal-api.
#
# Terminace TLS, CORS ani hlavní rate limit tady nejsou — to dělá ingress a
# samotná aplikace (limit se počítá na key_prefix z identity.api_credentials,
# ne na IP). Tenhle soubor řeší jen tři věci: předat požadavek FPM, ubrat
# hlavičky, které o platformě prozrazují víc, než mají, a propustit hlavičky
# z §0.3 beze změny.
# =============================================================================

server {
    listen 8091 default_server;
    server_name _;
    root /app/public;
    index index.php;

    client_max_body_size 32m;
    server_tokens off;

    # Hlavičky z §0.3 SPEC.md musí projít nedotčené až do aplikace. X-OF-Tenant
    # se ověřuje proti nároku `tid` v tokenu a neshoda znamená 403 — kdyby ji
    # proxy přepsala, ověření by kontrolovalo samo sebe.
    proxy_set_header X-OF-Tenant        $http_x_of_tenant;
    proxy_set_header X-OF-Trace-Id      $http_x_of_trace_id;
    proxy_set_header X-OF-Actor-Kind    $http_x_of_actor_kind;
    proxy_set_header X-OF-Idempotency-Key $http_x_of_idempotency_key;

    # Sondy z §3.15 obsluhuje aplikace, ale /healthz musí odpovědět i tehdy,
    # když FPM nestíhá — jinak by liveness zabila pod, který jen čeká na
    # pomalý dotaz do billing-service.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Partneři občas žádají výpis faktur za celý rok; 30 s je strop, po
        # kterém je odpověď stejně k ničemu a klient už dávno retryuje.
        fastcgi_read_timeout 30s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nic mimo public/ se ven nedostane, ani omylem.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
