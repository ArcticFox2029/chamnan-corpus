# =============================================================================
# identity-service — vydává a introspektuje tokeny, vlastní schéma `identity`.
#
# Vlna 0 rolloutu. Podle §1.2 na ni volá všech třináct zbylých služeb a sama
# nevolá synchronně nikoho; když je nedostupná, ostatní jedou na zapamatovaném
# JWKS nejvýš OF_IDENTITY_JWKS_GRACE_SECONDS a strojová volání odmítají hned.
# Odtud plyne všechno ostatní v tomhle souboru: šest replik, antiafinita na
# uzly, PDB v pdb.yaml s minAvailable 4 a nejkratší readiness perioda z celé
# platformy.
#
# Pozor na databázi: schéma `identity` se podle §2 zapisuje výhradně v
# eu-central. V ostatních regionech běží identity-service proti replice a
# zápisové cesty (POST /v1/credentials, POST /v1/tenants/{id}/org-units) tam
# vracejí 421 s odkazem na domovský region tenanta.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: go
    orbitalfreight.net/restart-wave: "0"
spec:
  replicas: 6
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: identity-service
      imagePullSecrets:
        - name: of-registry-pull
      # 45 s je nad OF_SHUTDOWN_GRACE_SECONDS (25) s rezervou na doběhnutí
      # otevřených introspekcí. Zkrátit to znamená useknout relay uprostřed
      # vyprazdňování platform.outbox_messages.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        fsGroup: 1400
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: identity-service
              topologyKey: kubernetes.io/hostname
      containers:
        - name: identity-service
          image: registry.orbitalfreight.net/of/identity-service:4.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081, protocol: TCP }
            - { name: grpc, containerPort: 9081, protocol: TCP }
          envFrom:
            - configMapRef: { name: of-common-config }
          env:
            - name: OF_SERVICE_NAME
              value: identity-service
            - name: OF_HTTP_PORT
              value: "8081"
            - name: OF_GRPC_PORT
              value: "9081"
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: identity-service }
            - name: OF_DATABASE_URL
              value: postgres://identity_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=identity&application_name=identity-service&sslmode=verify-full
            - name: OF_IDENTITY_SIGNING_KEY_PATH
              value: /etc/orbitalfreight/keys/identity-rs256-current.pem
            - name: OF_IDENTITY_ACCESS_TOKEN_TTL_SECONDS
              value: "900"
            - name: OF_IDENTITY_REFRESH_TOKEN_TTL_DAYS
              value: "30"
            - name: OF_IDENTITY_ARGON2_MEMORY_KIB
              value: "262144"
            - name: OF_IDENTITY_MFA_ISSUER
              value: ORBITALFREIGHT
            - name: OF_IDENTITY_MAX_ORG_DEPTH
              value: "12"
          resources:
            requests: { cpu: "1", memory: 1Gi }
            # Argon2id na POST /v1/credentials si vezme paměť ve špičce; limit
            # je proto nad requestem víc než u ostatních služeb.
            limits: { cpu: "4", memory: 3Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # /readyz sahá na databázi a Kafku. U identity-service ne na
            # identity-service — je sama sobě kořenem grafu.
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - { name: signing-keys, mountPath: /etc/orbitalfreight/keys, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: signing-keys
          secret:
            secretName: identity-service-signing-key
            defaultMode: 0400
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - { name: http, port: 8081, targetPort: http, protocol: TCP }
    - { name: grpc, port: 9081, targetPort: grpc, protocol: TCP }
