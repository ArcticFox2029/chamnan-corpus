# =============================================================================
# routing-service — plánování a přeplánování vícelegových tras, výpočet ETA.
#
# Volá geo-service (matice vzdáleností, snap-to-road) a customs-service
# (doporučení hraničního přechodu podle sazebníku). Obojí je synchronní a
# obojí je v §1.1; nic dalšího volat nesmí.
#
# Model pro ETA se čte ze souboru, který staví analytics-pipeline z
# analytics.mv_lane_performance_daily. Je to jediná vazba mezi těmito dvěma
# službami a je záměrně asynchronní — přes sdílený svazek, ne přes API. Kdyby
# routing-service volal analytics-pipeline synchronně, přibyla by hrana, kterou
# §1.1 nezná, a s ní latence dávkové úlohy na horké cestě plánování.
#
# OF_ROUTING_REPLAN_COOLDOWN_SECONDS je pojistka proti bouři přeplánování:
# každý replan publikuje `route.replanned`, na což reaguje fleet-service
# uvolněním přiřazení k legám, které zanikly. Bez cooldownu dokáže jedna
# blikající trasa vygenerovat stovky uvolnění za minutu.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: routing-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: python
    orbitalfreight.net/restart-wave: "3"
spec:
  replicas: 6
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 2 }
  selector:
    matchLabels: { app.kubernetes.io/name: routing-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "3"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
    spec:
      serviceAccountName: routing-service
      imagePullSecrets: [{ name: of-registry-pull }]
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: routing-service
          image: registry.orbitalfreight.net/of/routing-service:4.2.0
          ports:
            - { name: http, containerPort: 8085 }
          envFrom:
            - configMapRef: { name: of-common-config }
          env:
            - name: OF_SERVICE_NAME
              value: routing-service
            - name: OF_HTTP_PORT
              value: "8085"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: routing-service-v2
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: routing-service }
            - name: OF_DATABASE_URL
              value: postgres://routing_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=routing&application_name=routing-service&sslmode=verify-full
            - name: OF_GEO_GRPC_ADDR
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_GEO_GRPC_ADDR }
            - name: OF_CUSTOMS_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_CUSTOMS_BASE_URL }
            - name: OF_ROUTING_SOLVER_THREADS
              # Odpovídá limitu CPU. Víc vláken než jader solver zpomalí,
              # protože se přepíná uprostřed větvení a mezivýsledky vypadnou
              # z cache.
              value: "4"
            - name: OF_ROUTING_MAX_LEGS
              value: "24"
            - name: OF_ROUTING_ETA_MODEL_PATH
              value: /var/lib/orbitalfreight/routing/eta-model-current.bin
            - name: OF_ROUTING_REPLAN_COOLDOWN_SECONDS
              value: "180"
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: eta-model, mountPath: /var/lib/orbitalfreight/routing, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: eta-model
          persistentVolumeClaim:
            claimName: analytics-model-share
            readOnly: true
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: routing-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: routing-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: routing-service }
  ports:
    - { name: http, port: 8085, targetPort: http }
