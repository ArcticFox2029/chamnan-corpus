# =============================================================================
# Secrety, které se do clusteru dostávají jinak než přes SealedSecrets.
#
# Pravidlo: v gitu leží zašifrovaný SealedSecret (sealedsecrets.yaml), a tenhle
# soubor drží jenom ty dvě věci, které zapečetit nejdou:
#
#   1. `of-registry-pull` — přihlášení do registry.orbitalfreight.net. Musí
#      existovat dřív, než v clusteru poběží controller SealedSecrets, protože
#      bez něj se nestáhne ani jeho vlastní image.
#   2. `of-database-url-template` — ne heslo, ale tvar připojovacího řetězce.
#      Skládá se z něj OF_DATABASE_URL, do kterého init kontejner doplní heslo
#      z rozpečetěného secretu. Držet celý řetězec zapečetěný by znamenalo
#      měnit šifrovaný blob při každé změně search_path.
#
# Jedna poznámka k `OF_DB_PASSWORD`, které je v manifestech služeb: §5 SPEC.md
# říká, že služba spadne na proměnné OF_*, kterou §5 nezná. Tahle je jediná
# vědomá výjimka a `ops/validate-env.py` ji zná — není to konfigurace služby,
# ale vstup, ze kterého kubelet složí OF_DATABASE_URL přes $(VAR) rozvoj.
# Aplikace ji nikdy nečte a přidávat další takovou výjimku není v pořádku.
#
# Hodnoty `stringData` níž jsou zástupné a v clusteru se přepisují. Skutečné
# heslo se do gitu nedostane ani omylem — pre-commit hook v ops/ hledá v
# tomhle adresáři base64 delší než 40 znaků a commit odmítne.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: of-registry-pull
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/part-of: orbitalfreight
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.orbitalfreight.net":{"username":"of-cluster-puller","password":"__NAHRAZUJE_SE_PRI_BOOTSTRAPU__"}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: of-database-url-template
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # search_path se doplňuje podle vlastnícího schématu služby (§2). Služba,
  # která dostane cizí search_path, začne mlčky číst cizí tabulky — a to je
  # přesně to, co pravidlo 2 v §7 zakazuje.
  OF_DATABASE_URL_TEMPLATE: >-
    postgres://{{user}}:{{password}}@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path={{schema}}&application_name={{service}}&sslmode=verify-full
  OF_DATABASE_HOST: pg-primary.orbitalfreight.svc.cluster.local
  # Repliky pro čtení. identity-service je výjimka a míří vždy na primár:
  # schéma `identity` se podle §2 zapisuje výhradně v eu-central.
  OF_DATABASE_REPLICA_HOST: pg-replica.orbitalfreight.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-readonly-database
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: analytics-pipeline
type: Opaque
stringData:
  # Jediná role, která smí číst napříč všemi schématy (§2). Je to důvod, proč
  # je fyzická databáze vůbec sdílená — a taky důvod, proč je striktně
  # read-only: zápis odsud by obešel vlastníka schématu.
  OF_ANALYTICS_READONLY_DATABASE_URL: >-
    postgres://of_analytics_ro:__NAHRAZUJE_SE_PRI_BOOTSTRAPU__@pg-replica.orbitalfreight.svc.cluster.local:5432/orbitalfreight?sslmode=verify-full
