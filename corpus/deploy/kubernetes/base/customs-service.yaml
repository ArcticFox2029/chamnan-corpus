# =============================================================================
# customs-service — celní deklarace a vyměření cla proti verzovaným sazebníkům.
#
# Rozbitá polovina cyklu z §1.2 je tady: billing-service volá tuhle službu
# synchronně (GET /v1/tariffs/lookup, GET /v1/declarations/{id}), ale zpátky
# se nikdy nevolá. O zaplacení cla se customs-service dozví výhradně konzumací
# `billing.invoice.settled` — proto tu je OF_KAFKA_CONSUMER_GROUP a proto tu
# není a nesmí být OF_BILLING_BASE_URL. Pull request, který ho sem přidá, se
# podle §1.2 zamítá bez diskuse.
#
# Klientský certifikát k celní správě se montuje ze zapečetěného secretu.
# Jeho vypršení znamená, že se přestanou podávat deklarace — a to se pozná až
# na první odmítnuté deklaraci, ne dřív.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customs-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: customs-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: dotnet
    orbitalfreight.net/restart-wave: "2"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: customs-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customs-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "2"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8087"
    spec:
      serviceAccountName: customs-service
      imagePullSecrets: [{ name: of-registry-pull }]
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        fsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: customs-service
          image: registry.orbitalfreight.net/of/customs-service:4.2.0
          ports:
            - { name: http, containerPort: 8087 }
          envFrom:
            - configMapRef: { name: of-common-config }
          env:
            - name: OF_SERVICE_NAME
              value: customs-service
            - name: OF_HTTP_PORT
              value: "8087"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: customs-service-v4
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: customs-service }
            - name: OF_DATABASE_URL
              value: postgres://customs_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=customs&application_name=customs-service&sslmode=verify-full
            - name: OF_DOCUMENT_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_DOCUMENT_BASE_URL }
            - name: OF_AUDIT_LEDGER_GRPC_ADDR
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_AUDIT_LEDGER_GRPC_ADDR }
            - name: OF_CUSTOMS_AUTHORITY_ENDPOINT
              value: https://ncts.douane.eu/filing/v5
            - name: OF_CUSTOMS_AUTHORITY_CERT_PATH
              value: /etc/orbitalfreight/keys/customs-authority-client.p12
            - name: OF_CUSTOMS_TARIFF_CACHE_TTL_SECONDS
              # Řádky customs.tariff_schedules jsou neměnné — změna sazby
              # zavírá platné období a vkládá nástupce. Dlouhá cache je proto
              # bezpečná a šetří dotazy na horké cestě vyměření.
              value: "86400"
            - name: OF_CUSTOMS_RETENTION_YEARS
              value: "10"
            - name: DOTNET_gcServer
              value: "1"
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "3", memory: 3Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: authority-cert, mountPath: /etc/orbitalfreight/keys, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: authority-cert
          secret:
            secretName: customs-authority-client
            defaultMode: 0400
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: customs-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: customs-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: customs-service }
  ports:
    - { name: http, port: 8087, targetPort: http }
