# =============================================================================
# billing-service — z zásilek, vyměřeného cla a příplatků dělá faktury.
#
# Vlna 5, tedy skoro nakonec: volá customs-service, fleet-service a
# document-service, a bez nich vydá fakturu bez cla nebo bez podkladů.
#
# Dvě události, které tuhle službu řídí a které nejsou vidět z manifestu, ale
# vysvětlují jeho nastavení:
#
#   * `reconciliation.discrepancy.opened` — faktura jde na `on_hold` a
#     `hold_reason` se plní z `kind`. Zpátky se nikdy nevolá (§1.2), takže tu
#     není žádná adresa na reconciliation-service.
#   * `shipment.scanned` se `scan_type = 'proof_of_delivery'` odemyká
#     fakturaci. Odtud plyne, že konzumace nesmí zaostávat — proto vlastní
#     HPA na lagu konzumenta v hpa.yaml a ne jen na CPU.
#
# Peníze jsou celá čísla v minoritních jednotkách a vždy s měnou (§0.2, §7
# pravidlo 4). Žádná proměnná tady nesmí zavést kurzový přepočet za běhu —
# kurz se zmrazí při vydání faktury a bere se z OF_BILLING_FX_RATE_SOURCE.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: ruby
    orbitalfreight.net/restart-wave: "5"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: billing-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "5"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
    spec:
      serviceAccountName: billing-service
      imagePullSecrets: [{ name: of-registry-pull }]
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: billing-service
          image: registry.orbitalfreight.net/of/billing-service:4.2.0
          ports:
            - { name: http, containerPort: 8088 }
          envFrom:
            - configMapRef: { name: of-common-config }
          env:
            - name: OF_SERVICE_NAME
              value: billing-service
            - name: OF_HTTP_PORT
              value: "8088"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: billing-service-v7
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: billing-service }
            - name: OF_DATABASE_URL
              value: postgres://billing_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=billing&application_name=billing-service&sslmode=verify-full
            - name: OF_CUSTOMS_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_CUSTOMS_BASE_URL }
            - name: OF_FLEET_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_FLEET_BASE_URL }
            - name: OF_DOCUMENT_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_DOCUMENT_BASE_URL }
            - name: OF_BILLING_INVOICE_NUMBER_FORMAT
              # Číselná řada musí být bez děr v rámci roku a nájemce — proto
              # se sekvence bere z databáze, ne z počítadla v procesu.
              value: "OF-{tenant_short}-{year}-{seq:06d}"
            - name: OF_BILLING_DEFAULT_PAYMENT_TERMS_DAYS
              value: "30"
            - name: OF_BILLING_FX_RATE_SOURCE
              value: ecb-daily
            - name: OF_BILLING_HOLD_ON_DISCREPANCY_KINDS
              value: duty_mismatch,missing_declaration,cleared_without_payment
            - name: RAILS_ENV
              value: production
            - name: WEB_CONCURRENCY
              value: "4"
          resources:
            requests: { cpu: "1", memory: 1536Mi }
            limits: { cpu: "3", memory: 3Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: billing-service }
  ports:
    - { name: http, port: 8088, targetPort: http }
