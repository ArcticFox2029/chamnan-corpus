# =============================================================================
# Jmenný prostor platformy a jeho tvrdé limity.
#
# Jméno `orbitalfreight` není volba estetiky — §1 SPEC.md říká, že každá služba
# je dosažitelná na
# http://<service-name>.orbitalfreight.svc.cluster.local:<http_port>, a to
# prostřední slovo je právě tenhle namespace. Přejmenovat ho znamená přepsat
# všechny adresní proměnné OF_*_BASE_URL a OF_*_GRPC_ADDR v celé platformě.
#
# Druhý namespace `orbitalfreight-edge` drží provisioning depotních bran —
# jednorázové úlohy, které bráně přidělí gwy_ id, zapíšou její veřejný klíč do
# telemetry.device_gateways a vydají certifikát. Je oddělený proto, aby tyhle
# úlohy měly vlastní síťovou politiku a nesdílely servisní účty s produkčními
# službami. Samotný příjem dávek běží v `orbitalfreight`, protože Ingress
# nemůže odkazovat na Service v cizím namespace.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: orbitalfreight
  labels:
    app.kubernetes.io/part-of: orbitalfreight
    orbitalfreight.net/tier: backend
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: orbitalfreight-edge
  labels:
    app.kubernetes.io/part-of: orbitalfreight
    orbitalfreight.net/tier: edge
    pod-security.kubernetes.io/enforce: baseline
---
# Kvóta je nastavená tak, aby se do ní vešel katalog čtrnácti služeb v
# produkčním počtu replik plus jedno rolling okno navíc (maxSurge). Když
# rollout narazí na kvótu, zůstane viset v ContainerCreating a vypadá to jako
# problém s image — proto raději rezerva.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orbitalfreight-quota
  namespace: orbitalfreight
spec:
  hard:
    requests.cpu: "160"
    requests.memory: 480Gi
    limits.cpu: "320"
    limits.memory: 720Gi
    persistentvolumeclaims: "24"
    count/deployments.apps: "20"
    count/statefulsets.apps: "6"
    count/cronjobs.batch: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: orbitalfreight-defaults
  namespace: orbitalfreight
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 200m
        memory: 384Mi
      # Strop na kontejner. geo-service s mapovaným road grafem a
      # analytics-pipeline se Sparkem si o víc říkají výslovně ve svých
      # manifestech; ostatní se sem musí vejít.
      max:
        cpu: "8"
        memory: 24Gi
