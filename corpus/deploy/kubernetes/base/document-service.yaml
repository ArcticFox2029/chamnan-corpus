# =============================================================================
# document-service — jediné místo, kde v platformě leží binární přílohy.
#
# Druhý list grafu (§1.2). Volá ho pět služeb, ale sám nevolá nic kromě
# identity-service a objektového úložiště.
#
# Diamant B z §1.2 se řeší tady: partner-portal-api zavolá billing-service i
# customs-service a obě chtějí přiložit tutéž fakturu v PDF. Druhý zápis musí
# poznat duplicitu podle platform.documents.sha256 a vrátit existující doc_
# id, ne uložit blob znovu. Proto má služba přístup k databázi (unikátní index
# na (tenant_id, sha256, owner_type, owner_id)) a proto se nesmí škálovat na
# nulu — bez ní se nedá zapsat ani deklarace, ani faktura.
#
# Rezidence: OF_DOCUMENT_BUCKET je jeden na region. Dokument označený
# latam-br se nesmí dostat do evropského bucketu (§7, pravidlo 7), takže
# hodnota přichází z regionálního overlaye, ne odsud.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: typescript
    orbitalfreight.net/restart-wave: "1"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: document-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8089"
    spec:
      serviceAccountName: document-service
      imagePullSecrets: [{ name: of-registry-pull }]
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: document-service
          image: registry.orbitalfreight.net/of/document-service:4.2.0
          ports:
            - { name: http, containerPort: 8089 }
          envFrom:
            - configMapRef: { name: of-common-config }
            - secretRef: { name: document-storage-credentials }
          env:
            - name: OF_SERVICE_NAME
              value: document-service
            - name: OF_HTTP_PORT
              value: "8089"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: document-service-v2
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: document-service }
            - name: OF_DATABASE_URL
              value: postgres://document_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=platform&application_name=document-service&sslmode=verify-full
            - name: OF_DOCUMENT_BUCKET
              value: of-documents-eu-west
            - name: OF_DOCUMENT_SIGNED_URL_TTL_SECONDS
              value: "900"
            - name: OF_DOCUMENT_MAX_UPLOAD_BYTES
              value: "134217728"
            - name: OF_DOCUMENT_ALLOWED_MIME_TYPES
              value: application/pdf,image/jpeg,image/png,image/heic,application/xml
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            # Limit paměti počítá s tím, že se multipart upload streamuje na
            # disk, ne do haldy. Kdyby se to změnilo, 128MB soubor krát čtyři
            # souběžné uploady limit přeteče.
            limits: { cpu: "2", memory: 2Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: upload-spool, mountPath: /var/tmp/uploads }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: upload-spool
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: document-service }
  ports:
    - { name: http, port: 8089, targetPort: http }
