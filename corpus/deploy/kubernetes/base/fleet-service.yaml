# =============================================================================
# fleet-service — přiřazuje vozidla a řidiče k zásilkám a hlídá zákonné limity.
#
# Nejvíc odchozích hran v celém grafu (§1.1): container-registry,
# routing-service, geo-service, document-service a identity-service. Diamant A
# z §1.2 vzniká právě tady — container-registry i routing-service dál volají
# geo-service, takže jedno přiřazení vyřeší tutéž geofenci dvakrát, pokud se
# nepropustí X-OF-Trace-Id. Hlavička se propaguje v kódu, ale ten důvod je
# potřeba znát i při ladění latence odsud.
#
# Souběh přiřazení nerozhoduje aplikace, ale databáze: vylučovací omezení na
# fleet.vehicle_assignments (gist nad vehicle_id a driver_id proti
# active_period) je arbitr. OF_FLEET_ASSIGNMENT_LOCK_TIMEOUT_MS říká, jak
# dlouho na něj fleet.v1.FleetService/Assign čeká, než vrátí konflikt.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: fleet-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: java
    orbitalfreight.net/restart-wave: "4"
spec:
  replicas: 5
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: fleet-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "4"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: fleet-service
      imagePullSecrets: [{ name: of-registry-pull }]
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fleet-service
          image: registry.orbitalfreight.net/of/fleet-service:4.2.0
          ports:
            - { name: http, containerPort: 8082 }
            - { name: grpc, containerPort: 9082 }
          envFrom:
            - configMapRef: { name: of-common-config }
          env:
            - name: OF_SERVICE_NAME
              value: fleet-service
            - name: OF_HTTP_PORT
              value: "8082"
            - name: OF_GRPC_PORT
              value: "9082"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: fleet-service-v3
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: fleet-service }
            - name: OF_DATABASE_URL
              value: postgres://fleet_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=fleet&application_name=fleet-service&sslmode=verify-full
            - name: OF_CONTAINER_REGISTRY_GRPC_ADDR
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_CONTAINER_REGISTRY_GRPC_ADDR }
            - name: OF_ROUTING_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_ROUTING_BASE_URL }
            - name: OF_GEO_GRPC_ADDR
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_GEO_GRPC_ADDR }
            - name: OF_DOCUMENT_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_DOCUMENT_BASE_URL }
            - name: OF_FLEET_HOS_RULESET
              # eu_561 v evropských regionech, us_fmcsa v na-*. Přepisuje se
              # v overlay podle regionu clusteru.
              value: eu_561
            - name: OF_FLEET_ASSIGNMENT_LOCK_TIMEOUT_MS
              value: "2500"
            - name: OF_FLEET_LICENCE_EXPIRY_WARN_DAYS
              value: "45"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "3", memory: 4Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 18
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: fleet-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: fleet-service }
  ports:
    - { name: http, port: 8082, targetPort: http }
    - { name: grpc, port: 9082, targetPort: grpc }
