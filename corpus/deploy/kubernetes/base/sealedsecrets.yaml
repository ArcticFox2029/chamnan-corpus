# =============================================================================
# Zapečetěné secrety (bitnami-labs/sealed-secrets).
#
# Zašifrované blby níž jsou vázané na jeden konkrétní cluster a na jeden
# namespace — controller je jinde nerozpečetí, i kdyby soubor unikl. To je
# celý důvod, proč tenhle soubor smí ležet v gitu.
#
# Rotace: `kubeseal --re-encrypt` nestačí, když se mění samotná hodnota. Postup
# je vždycky stejný — nová hodnota, nové zapečetění, commit, nasazení, a
# teprve pak zneplatnění staré hodnoty na druhé straně. U
# identity-service tenhle pořádek platí dvojnásob: podepisovací klíč se
# vyměňuje překryvem, protože tokeny vydané starým klíčem žijí ještě
# OF_IDENTITY_ACCESS_TOKEN_TTL_SECONDS (900 s) a JWKS musí obě verze
# publikovat po celou tu dobu.
# =============================================================================
