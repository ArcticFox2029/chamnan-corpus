# =============================================================================
# Servisní účty čtrnácti služeb.
#
# Každá služba má vlastní účet, i když většina z nich do Kubernetes API vůbec
# nesahá. Důvod je audit: `actor_id` v platform.audit_ledger_entries u
# strojových zápisů odpovídá jménu služby, a stejné jméno musí nést i identita
# v clusteru, jinak se z ledgeru nedá zpětně určit, který pod zápis provedl.
#
# automountServiceAccountToken je všude false s jednou výjimkou (viz níž).
# Služba, která token nepotřebuje, ho nemá mít připojený — je to nejlevnější
# způsob, jak omezit škodu z prolomeného kontejneru.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-service
  namespace: orbitalfreight
  labels: { app.kubernetes.io/name: identity-service, app.kubernetes.io/part-of: orbitalfreight }
automountServiceAccountToken: false
---
