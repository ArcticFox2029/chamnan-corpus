# Jediná výjimka: analytics-pipeline si přes Kubernetes API spouští Spark
# executory, takže token potřebuje. Její oprávnění jsou proto v rbac.yaml
# nejužší ze všech — jenom pody, a jenom v tomhle namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-pipeline
  namespace: orbitalfreight
  labels: { app.kubernetes.io/name: analytics-pipeline, app.kubernetes.io/part-of: orbitalfreight }
automountServiceAccountToken: true
