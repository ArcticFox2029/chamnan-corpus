# =============================================================================
# notification-service — rozesílá události lidem: e-mail, SMS, push, webhooky.
#
# Konzumuje z pěti témat a nemá skoro žádný synchronní provoz dovnitř — kromě
# POST /v1/notifications/dispatch, které používá konzole a operátoři. Volá jen
# document-service (přílohy) a identity-service.
#
# Preferenční tabulka platform.notification_preferences včetně tichých hodin
# se vyhodnocuje pro každého příjemce zvlášť, v jeho vlastním časovém pásmu.
# To je důvod, proč se pody neškálují podle CPU: zátěž je nárazová a řídí ji
# lag konzumenta, ne procesor.
#
# OF_NOTIFY_MAX_ATTEMPTS musí zůstat na osmi, protože stejné číslo drží
# pravidlo 4 v §4.19 pro odchod do <topic>.dlq. Kdyby se rozešla, zpráva by
# buď skončila v DLQ dřív, než se doručování vzdalo, nebo naopak.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: orbitalfreight
    app.kubernetes.io/component: backend
    orbitalfreight.net/language: elixir
    orbitalfreight.net/restart-wave: "2"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: notification-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: orbitalfreight
        orbitalfreight.net/restart-wave: "2"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      serviceAccountName: notification-service
      imagePullSecrets: [{ name: of-registry-pull }]
      # Rozeslaná, ale nepotvrzená zpráva se po restartu pošle znovu —
      # unikátní klíč (source_event_id, channel, recipient_user_id) z toho
      # dělá no-op. Přesto dáváme podu čas dopsat stav, ať se v
      # platform.notifications nehromadí `sending`.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1400
        runAsGroup: 1400
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification-service
          image: registry.orbitalfreight.net/of/notification-service:4.2.0
          ports:
            - { name: http, containerPort: 8090 }
          envFrom:
            - configMapRef: { name: of-common-config }
            - secretRef: { name: notification-provider-tokens }
          env:
            - name: OF_SERVICE_NAME
              value: notification-service
            - name: OF_HTTP_PORT
              value: "8090"
            - name: OF_KAFKA_CONSUMER_GROUP
              value: notification-service-v6
            - name: OF_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: of-database-passwords, key: notification-service }
            - name: OF_DATABASE_URL
              value: postgres://notification_svc:$(OF_DB_PASSWORD)@pg-primary.orbitalfreight.svc.cluster.local:5432/orbitalfreight?search_path=platform&application_name=notification-service&sslmode=verify-full
            - name: OF_DOCUMENT_BASE_URL
              valueFrom:
                configMapKeyRef: { name: of-service-addresses, key: OF_DOCUMENT_BASE_URL }
            - name: OF_NOTIFY_PUSH_APNS_KEY_PATH
              value: /etc/orbitalfreight/keys/apns-driver-ios.p8
            - name: OF_NOTIFY_PUSH_FCM_KEY_PATH
              value: /etc/orbitalfreight/keys/fcm-inspector-android.json
            - name: OF_NOTIFY_WEBHOOK_TIMEOUT_MS
              # Partnerské webhooky bývají pomalé. Čtyři sekundy jsou strop,
              # po kterém se pokus počítá jako neúspěšný a jde do backoffu.
              value: "4000"
            - name: OF_NOTIFY_MAX_ATTEMPTS
              value: "8"
            - name: OF_NOTIFY_TEMPLATE_DIR
              value: /etc/orbitalfreight/notification/templates
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: push-keys, mountPath: /etc/orbitalfreight/keys, readOnly: true }
            - { name: templates, mountPath: /etc/orbitalfreight/notification/templates, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: push-keys
          secret:
            secretName: notification-provider-tokens
            defaultMode: 0400
            items:
              - { key: apns-driver-ios.p8, path: apns-driver-ios.p8 }
              - { key: fcm-inspector-android.json, path: fcm-inspector-android.json }
        - name: templates
          configMap:
            name: notification-service-templates
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-templates
  namespace: orbitalfreight
  labels: { app.kubernetes.io/name: notification-service }
data:
  # Šablony mění provoz za běhu (viz role notification-templates-reader v
  # rbac.yaml). Kód šablony odpovídá platform.notifications.template_code;
  # přejmenovat ho znamená osiřelé řádky preferencí u uživatelů.
  shipment_delayed.subject.txt: |
    Zásilka {{shipment_reference}} nabírá zpoždění
  shipment_delayed.body.txt: |
    Zásilka {{shipment_reference}} ({{origin_unlocode}} → {{destination_unlocode}})
    má nový odhad příjezdu {{planned_arrive_at}}.
    Důvod: {{reason_code}}.
  invoice_overdue.subject.txt: |
    Faktura {{invoice_number}} je po splatnosti
  invoice_overdue.body.txt: |
    Faktura {{invoice_number}} na {{total_minor_formatted}} {{currency}}
    byla splatná {{due_on}}.
  telemetry_alert.subject.txt: |
    Poplach {{rule_code}} na kontejneru {{container_iso_code}}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: orbitalfreight
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: orbitalfreight
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: notification-service }
  ports:
    - { name: http, port: 8090, targetPort: http }
