# =============================================================================
# Inventář pro CI.
#
# Všechno běží v jednom kontejneru na runneru, adresované přes localhost s
# ansible_connection=local. Účel není nasadit platformu, ale ověřit, že role
# projdou v --check režimu a že šablony vyrenderují validní konfiguraci —
# hlavně of-service.env.j2, protože ops/validate-env.py z §5 SPEC.md se pouští
# právě na její výstup.
#
# Regionem je záměrně eu-west: OF_REGION_CODE musí být hodnota ze zavřeného
# seznamu §0.6, "ci" tam není a služba by na startu spadla.
# =============================================================================
all:
  vars:
    of_environment: ci
    of_region: eu-west
    of_platform_version: "0.0.0-ci"
    of_domain: ci.internal
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    of_app:
      hosts:
        ci-runner-local:
          of_app_slot: a
    of_postgres:
      children:
        of_postgres_primary:
          hosts:
            ci-runner-local: {}
        of_postgres_replica:
          hosts: {}
      vars:
        of_postgres_version: 16
    of_kafka:
      hosts:
        ci-runner-local:
          of_kafka_broker_id: 1
    of_edge:
      hosts:
        ci-runner-local:
          of_depot_id: dep_01J7Z0000000000000000000CI
          of_gateway_serial: GW-CI-0001
    of_observability:
      hosts:
        ci-runner-local: {}
