# =============================================================================
# Stagingový inventář ORBITALFREIGHT.
#
# Jeden region (eu-west), jeden Postgres, jeden broker. Staging schválně
# neduplikuje produkční topologii — kdo chce testovat multiregionální
# rezidenci dat, musí do produkce s feature flagem, ne sem.
#
# Rozdíly proti produkci jsou jen v group_vars/all.yml (log level debug,
# OF_OTEL_SAMPLE_RATIO 1.0, kratší TTL podepsaných URL). Role jsou stejné,
# jinak by staging netestoval nic užitečného.
# =============================================================================
all:
  vars:
    of_environment: staging
    of_platform_version: "4.2.0"
    of_domain: staging.orbitalfreight.net
  children:

    of_app:
      hosts:
        of-stg-app-eu-west-01.staging.orbitalfreight.net:
          of_region: eu-west
          of_app_slot: a
        of-stg-app-eu-west-02.staging.orbitalfreight.net:
          of_region: eu-west
          of_app_slot: b

    of_postgres:
      vars:
        of_postgres_version: 16
      children:
        of_postgres_primary:
          hosts:
            of-stg-pg-eu-west-01.staging.orbitalfreight.net:
              of_region: eu-west
              of_postgres_role: primary
        of_postgres_replica:
          hosts: {}

    of_kafka:
      hosts:
        of-stg-kafka-eu-west-01.staging.orbitalfreight.net:
          of_region: eu-west
          of_kafka_broker_id: 1

    of_edge:
      hosts:
        of-stg-edge-gw-eu-west-01.staging.orbitalfreight.net:
          of_region: eu-west
          of_depot_id: dep_01J7F1P5Q9RJTC3ZNM6XBW4HDK
          of_gateway_serial: GW-STG-0001

    of_notary:
      hosts:
        of-stg-notary-eu-west-01.staging.orbitalfreight.net:
          of_region: eu-west

    of_observability:
      hosts:
        of-stg-otel-eu-west-01.staging.orbitalfreight.net:
          of_region: eu-west
