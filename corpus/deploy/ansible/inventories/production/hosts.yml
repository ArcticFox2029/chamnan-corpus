# =============================================================================
# Produkční inventář ORBITALFREIGHT.
#
# Čtyři regiony ze zavřeného seznamu v §0.6 SPEC.md: eu-west (primární),
# eu-central (jediný region, kde se do schématu `identity` zapisuje), na-east
# a apac-sg. latam-br a mea-ae jedou u partnerů a v tomhle inventáři nejsou.
#
# Skupina hosta určuje, které role na něj site.yml pustí; region určuje hodnotu
# OF_REGION_CODE, která se razítkuje do každé obálky události (§0.7), takže
# překlep v `of_region` znamená data zapsaná do cizí rezidence — viz pravidlo 7
# v §7 SPEC.md. Proto je region uvedený i v názvu stroje, ne jen v proměnné.
# =============================================================================
all:
  vars:
    of_environment: production
    of_platform_version: "4.2.0"
    of_domain: orbitalfreight.net
  children:

    of_app:
      # Uzly, na kterých běží kontejnery čtrnácti služeb mimo Kubernetes —
      # tj. pouze regiony, kde ještě nemáme cluster (na-east migruje v Q4).
      hosts:
        of-prod-app-na-east-01.orbitalfreight.net:
          of_region: na-east
          of_app_slot: a
        of-prod-app-na-east-02.orbitalfreight.net:
          of_region: na-east
          of_app_slot: b
        of-prod-app-na-east-03.orbitalfreight.net:
          of_region: na-east
          of_app_slot: c

    of_postgres:
      vars:
        of_postgres_version: 16
      children:
        of_postgres_primary:
          hosts:
            of-prod-pg-eu-central-01.orbitalfreight.net:
              of_region: eu-central
              of_postgres_role: primary
        of_postgres_replica:
          hosts:
            of-prod-pg-eu-west-01.orbitalfreight.net:
              of_region: eu-west
              of_postgres_role: replica
            of-prod-pg-na-east-01.orbitalfreight.net:
              of_region: na-east
              of_postgres_role: replica
            of-prod-pg-apac-sg-01.orbitalfreight.net:
              of_region: apac-sg
              of_postgres_role: replica

    of_kafka:
      hosts:
        of-prod-kafka-eu-west-01.orbitalfreight.net:
          of_region: eu-west
          of_kafka_broker_id: 1
        of-prod-kafka-eu-west-02.orbitalfreight.net:
          of_region: eu-west
          of_kafka_broker_id: 2
        of-prod-kafka-eu-west-03.orbitalfreight.net:
          of_region: eu-west
          of_kafka_broker_id: 3
        of-prod-kafka-apac-sg-01.orbitalfreight.net:
          of_region: apac-sg
          of_kafka_broker_id: 11
        of-prod-kafka-apac-sg-02.orbitalfreight.net:
          of_region: apac-sg
          of_kafka_broker_id: 12

    of_edge:
      # Depotní brány. Sbírají čtení ze senzorů a posílají je do
      # telemetry-ingest na POST /v1/ingest/batch, podepsané klíčem depa.
      hosts:
        of-prod-edge-gw-eu-west-01.orbitalfreight.net:
          of_region: eu-west
          of_depot_id: dep_01J7C2M4X0PQRA5TDN8VYK3EWZ
          of_gateway_serial: GW-EUW-0001
        of-prod-edge-gw-eu-west-02.orbitalfreight.net:
          of_region: eu-west
          of_depot_id: dep_01J7C2M4X0PQRA5TDN8VYK3EWZ
          of_gateway_serial: GW-EUW-0002
        of-prod-edge-gw-apac-sg-01.orbitalfreight.net:
          of_region: apac-sg
          of_depot_id: dep_01J7D9H6B2ZKF4MSCP1RTQ7NXV
          of_gateway_serial: GW-SGP-0001
        of-prod-edge-gw-na-east-01.orbitalfreight.net:
          of_region: na-east
          of_depot_id: dep_01J7E4K8N3WVGD6XHR2LMB9TSA
          of_gateway_serial: GW-NAE-0001

    of_notary:
      # Mirror podepsané hlavičky řetězce z audit-ledger. Stojí schválně mimo
      # of_app: kdyby ho vzal stejný výpadek, nemáme s čím porovnat.
      hosts:
        of-prod-notary-eu-central-01.orbitalfreight.net:
          of_region: eu-central

    of_observability:
      hosts:
        of-prod-otel-eu-west-01.orbitalfreight.net:
          of_region: eu-west
        of-prod-otel-na-east-01.orbitalfreight.net:
          of_region: na-east
        of-prod-otel-apac-sg-01.orbitalfreight.net:
          of_region: apac-sg
