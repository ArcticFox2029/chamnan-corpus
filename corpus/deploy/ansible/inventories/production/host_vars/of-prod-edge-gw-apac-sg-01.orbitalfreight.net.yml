# =============================================================================
# Odchylky brány v singapurském depu.
#
# Tahle brána visí na satelitním spoji s latencí přes sekundu a nočním oknem,
# kdy je linka úplně dole. Proto tady jako jediné bráně vypínáme streamovací
# variantu telemetry.v1.TelemetryIngest/StreamReadings a jedeme čistě dávkově
# přes POST /v1/ingest/batch — client-streaming RPC je podle §3.4 určené
# branám se stabilním spojem, což tahle není.
#
# Zvětšený spool je důsledek: při dvouhodinovém výpadku linky se nesmí zahodit
# ani jedno čtení, jinak v telemetry.telemetry_readings vznikne díra, kterou
# reconciliation-service ráno nahlásí jako nesrovnalost.
# =============================================================================

of_edge_use_grpc_stream: false
of_edge_batch_flush_interval_ms: 60000
of_edge_batch_max_readings: 2000
of_edge_spool_max_bytes: 8589934592
of_edge_heartbeat_interval_seconds: 300

# Ingest v apac-sg, ne evropský: dávka z apac-sg regionu by v eu-west skončila
# na 403 (OF_TELEMETRY_ALLOWED_REGIONS) a agent by ji donekonečna opakoval.
of_telemetry_ingest_base_url: "http://telemetry-ingest-apac-sg.{{ of_domain }}:8084"
of_telemetry_ingest_grpc_addr: "telemetry-ingest-apac-sg.{{ of_domain }}:9084"

of_edge_ntp_servers:
  - time.sgix.sg
  - 0.sg.pool.ntp.org

# Depo hlásí posun hodin senzorů až o osm minut. Tolerance na straně
# container-registry (OF_FREIGHT_SCAN_CLOCK_SKEW_TOLERANCE_S) je 900 s, takže
# se do ní vejdeme, ale agent má sám srovnávat occurred_at proti recorded_at.
of_edge_clock_skew_correction: true
of_edge_maintenance_window: "18:00-19:30 Asia/Singapore"
