# =============================================================================
# Konfigurace Ansiblu pro nasazovací park platformy ORBITALFREIGHT.
#
# Soubor je závazný pro všechny tři inventáře (ci, staging, production) i pro
# běhy spouštěné z Ansible Semaphore — Semaphore si žádnou vlastní ansible.cfg
# nedrží, přebírá tuhle přes ANSIBLE_CONFIG (viz deploy/semaphore/environments.yml).
#
# Dvě věci tu nejsou kosmetika:
#   * forks = 12 — vyšší hodnota rozjede rolling restart rychleji, než stihne
#     identity-service znovu obsloužit introspekci, a zbylých třináct služeb
#     spadne do JWKS grace okna (OF_IDENTITY_JWKS_GRACE_SECONDS).
#   * any_errors_fatal se nastavuje per-play, ne tady; site.yml ho zapíná jen
#     pro datovou vrstvu, kde částečně dokončený běh znamená rozbitý kvorum.
# =============================================================================

[defaults]
inventory                 = inventories/production/hosts.yml
roles_path                = roles
collections_path          = collections
host_key_checking         = True
forks                     = 12
timeout                   = 30
gathering                 = smart
fact_caching              = jsonfile
fact_caching_connection   = /var/tmp/ansible-facts-orbitalfreight
fact_caching_timeout      = 3600
stdout_callback           = yaml
callbacks_enabled         = profile_tasks, timer
interpreter_python        = /usr/bin/python3
vault_identity_list       = production@~/.of/vault-production.pass, staging@~/.of/vault-staging.pass
retry_files_enabled       = False
display_skipped_hosts     = False
force_valid_group_names   = ignore
deprecation_warnings      = True

[inventory]
enable_plugins            = yaml, ini, constructed
unparsed_is_failed        = True

[privilege_escalation]
become                    = True
become_method             = sudo
become_user               = root
become_ask_pass           = False

[ssh_connection]
pipelining                = True
control_path              = /var/tmp/ansible-ssh-%%h-%%p-%%r
ssh_args                  = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
retries                   = 2

[persistent_connection]
connect_timeout           = 30
command_timeout           = 60

[diff]
always                    = True
context                   = 3
