# =============================================================================
# Odkazy na klíče uložené v key store Semaphoru.
#
# Soubor neobsahuje žádný tajný materiál a nikdy obsahovat nebude — jsou to
# jenom jména, typy a poznámka, kdo klíč vlastní a jak se rotuje. Skutečné
# hodnoty se do Semaphoru nahrávají ručně dvěma lidmi (čtyři oči) a odsud se
# jen adresují jménem.
#
# Rotace je tu popsaná záměrně: klíč, u kterého nikdo neví, kdy se naposledy
# měnil, se v praxi nemění vůbec. Termíny odpovídají tomu, co drží
# identity.api_credentials.rotated_at u strojových přihlašovacích údajů.
# =============================================================================
---
keys:

  - name: of-git-deploy-key
    type: ssh
    owner: platform-infra
    rotate_every_days: 365
    note: >-
      Read-only nasazovací klíč ke git.orbitalfreight.net. Nesmí mít právo
      zápisu — Semaphore nikdy nic necommituje.

  - name: of-ssh-production
    type: ssh
    owner: platform-infra
    rotate_every_days: 90
    note: >-
      Uživatel `deploy` na produkčních strojích. Přihlášení jen z Semaphore
      hosta, ověřeno přes `from=` v authorized_keys.

  - name: of-ssh-staging
    type: ssh
    owner: platform-infra
    rotate_every_days: 180

  - name: of-become-production
    type: login_password
    owner: platform-infra
    rotate_every_days: 90
    note: sudo heslo uživatele `deploy`; become_method je v ansible.cfg sudo.

  - name: of-become-staging
    type: login_password
    owner: platform-infra
    rotate_every_days: 180

  - name: vault_production_password
    type: login_password
    owner: security
    rotate_every_days: 365
    note: >-
      Heslo k vault identitě `production` — odemyká
      inventories/production/group_vars/vault_production.yml. Rotace znamená
      i přešifrování toho souboru přes `ansible-vault rekey`, ne jenom změnu
      hesla tady.

  - name: vault_staging_password
    type: login_password
    owner: security
    rotate_every_days: 365

  - name: of-registry-pull
    type: login_password
    owner: platform-infra
    rotate_every_days: 90
    note: >-
      Čtecí účet do registry.orbitalfreight.net. Používá ho role of_service při
      stahování image; zapisuje do registry výhradně CI, jiným účtem.

  - name: of-notary-client-cert
    type: ssh
    owner: security
    rotate_every_days: 730
    note: >-
      Klientský certifikát pro OF_LEDGER_NOTARY_ENDPOINT. Rotace se plánuje
      s notářem dopředu — po výměně nesmí vzniknout hodina, kdy se checkpoint
      nezrcadlí.
